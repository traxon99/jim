# Redeploys the MCP server to Fly (app jim-mcp, see fly.toml) whenever a change
# that goes into its image lands on main. Needs the FLY_API_TOKEN repo secret.
name: Deploy MCP server

on:
  push:
    branches: [main]
    paths:
      - apps/mcp/**
      - packages/**
      - fly.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing the running one.
concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  # Lint, typecheck and tests must pass before anything reaches Fly (#498).
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the 1.6 release commit rather than a moving branch.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
