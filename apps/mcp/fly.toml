# Deploy from the repo root so this build can see packages/db and
# packages/core (a pnpm workspace) — see README.md:
#   fly deploy . --config apps/mcp/fly.toml --dockerfile apps/mcp/Dockerfile
app = "jim-mcp"
primary_region = "iad"

[build]
  dockerfile = "apps/mcp/Dockerfile"

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  # "stop" would wipe this process's in-memory OAuth state (pending logins,
  # registered clients, transport sessions — see README.md) between scale-
  # to-zero cycles, breaking any login flow interrupted by a stop. Keep one
  # machine always running instead.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
